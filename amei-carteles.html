<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMEI · Evaluación de Carteles</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #14181c;
    --panel: #1b2126;
    --panel-2: #222a30;
    --line: #2c363d;
    --ink: #e9edf0;
    --ink-dim: #8fa0a8;
    --gold: #c99a4a;
    --gold-dim: #8a6d3a;
    --good: #5fa87a;
    --bad: #c06856;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    -webkit-font-smoothing:antialiased;
  }
  .sans{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .app{ max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  header.top{
    padding:22px 20px 18px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header.top .brand{ font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-family: -apple-system, sans-serif; font-weight:600;}
  header.top .who{ font-size:13px; color:var(--ink-dim); font-family: -apple-system, sans-serif; }
  header.top .who button{
    background:none;border:none;color:var(--ink-dim);text-decoration:underline;
    font-family:-apple-system, sans-serif; font-size:13px; padding:0; margin-left:10px; cursor:pointer;
  }

  main{ flex:1; padding:24px 20px 60px; }

  /* Login */
  .login-wrap{ display:flex; flex-direction:column; align-items:center; padding-top:14vh; text-align:center; }
  .login-wrap h1{ font-size:30px; margin:0 0 6px; font-weight:400; letter-spacing:.01em; }
  .login-wrap .sub{ color:var(--ink-dim); font-size:14px; margin-bottom:36px; font-family:-apple-system, sans-serif; }
  .field{ width:100%; max-width:340px; text-align:left; margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--ink-dim); margin-bottom:6px; font-family:-apple-system, sans-serif; letter-spacing:.03em; }
  input, textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    padding:12px 14px; border-radius:6px; font-size:16px; font-family:-apple-system, sans-serif;
  }
  input:focus, textarea:focus, button:focus-visible{ outline:2px solid var(--gold-dim); outline-offset:1px; }
  .btn{
    background:var(--gold); color:#1b1509; border:none; padding:12px 22px; border-radius:6px;
    font-family:-apple-system, sans-serif; font-weight:600; font-size:15px; cursor:pointer; width:100%; max-width:340px;
  }
  .btn:active{ transform:translateY(1px); }
  .btn.secondary{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .error-msg{ color:var(--bad); font-size:13px; margin-top:10px; font-family:-apple-system, sans-serif; min-height:16px; }

  /* Progress */
  .progress-wrap{ margin-bottom:26px; }
  .progress-wrap .label{ font-family:-apple-system, sans-serif; font-size:13px; color:var(--ink-dim); display:flex; justify-content:space-between; margin-bottom:8px; }
  .bar{ height:6px; background:var(--panel-2); border-radius:3px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--gold); transition:width .3s; }

  /* Poster cards */
  .poster{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px; margin-bottom:14px;
  }
  .poster.done{ border-color:var(--gold-dim); }
  .poster-head{ display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .poster-head .num{ color:var(--gold); font-size:12px; letter-spacing:.1em; font-family:-apple-system, sans-serif; }
  .poster-head h3{ margin:2px 0 0; font-size:19px; font-weight:400; }
  .poster-head .status{ font-family:-apple-system, sans-serif; font-size:12px; color:var(--ink-dim); }
  .poster-head .status.done{ color:var(--good); }
  .poster-body{ margin-top:16px; display:none; }
  .poster-body.open{ display:block; }

  .score-row{ margin-bottom:16px; }
  .score-row .score-label{ font-family:-apple-system, sans-serif; font-size:13px; color:var(--ink-dim); margin-bottom:8px; display:flex; justify-content:space-between; }
  .score-row .score-label .val{ color:var(--gold); font-weight:600; }
  input[type=range]{ width:100%; accent-color:var(--gold); background:transparent; padding:0; }
  textarea{ min-height:70px; resize:vertical; margin-top:4px; }

  .poster-actions{ display:flex; gap:10px; margin-top:14px; }
  .save-btn{
    flex:1; background:var(--gold); color:#1b1509; border:none; padding:11px; border-radius:6px;
    font-family:-apple-system, sans-serif; font-weight:600; font-size:14px; cursor:pointer;
  }
  .save-msg{ font-family:-apple-system, sans-serif; font-size:12px; color:var(--good); align-self:center; }

  /* Admin */
  .section-title{ font-family:-apple-system, sans-serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin:28px 0 12px; }
  .section-title:first-child{ margin-top:0; }
  table{ width:100%; border-collapse:collapse; font-family:-apple-system, sans-serif; font-size:14px; }
  th, td{ text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); }
  th{ color:var(--ink-dim); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .pill{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; }
  .pill.complete{ background:rgba(95,168,122,.15); color:var(--good); }
  .pill.pending{ background:rgba(192,104,86,.12); color:var(--bad); }

  .export-btn{
    margin-top:22px; background:transparent; border:1px solid var(--gold-dim); color:var(--gold);
    padding:10px 18px; border-radius:6px; font-family:-apple-system, sans-serif; font-size:13px; cursor:pointer; width:100%;
  }
  .hidden{ display:none !important; }
  .empty{ color:var(--ink-dim); font-family:-apple-system, sans-serif; font-size:13px; text-align:center; padding:30px 0; }
</style>
</head>
<body>

<div class="app">

  <!-- LOGIN -->
  <div id="view-login">
    <div class="login-wrap">
      <div class="brand" style="margin-bottom:20px;">AMEI · Congreso</div>
      <h1>Evaluación de carteles</h1>
      <div class="sub">Ingresa tu nombre y contraseña</div>
      <div class="field">
        <label for="in-nombre">Nombre</label>
        <input id="in-nombre" type="text" autocomplete="username">
      </div>
      <div class="field">
        <label for="in-pass">Contraseña</label>
        <input id="in-pass" type="password" autocomplete="current-password">
      </div>
      <button class="btn" id="btn-login">Entrar</button>
      <div class="error-msg" id="login-error"></div>
    </div>
  </div>

  <!-- JUDGE VIEW -->
  <div id="view-judge" class="hidden">
    <header class="top">
      <div class="brand">AMEI · Congreso</div>
      <div class="who sans">Juez: <span id="judge-name"></span><button id="btn-logout-j">salir</button></div>
    </header>
    <main>
      <div class="progress-wrap">
        <div class="label"><span>Tu avance</span><span id="progress-text">0 / 0</span></div>
        <div class="bar"><div class="bar-fill" id="progress-fill" style="width:0%"></div></div>
      </div>
      <div id="poster-list"></div>
    </main>
  </div>

  <!-- ADMIN VIEW -->
  <div id="view-admin" class="hidden">
    <header class="top">
      <div class="brand">AMEI · Congreso</div>
      <div class="who sans">Admin<button id="btn-logout-a">salir</button></div>
    </header>
    <main>
      <div class="section-title">Avance por juez</div>
      <table id="tbl-jueces"><thead><tr><th>Juez</th><th class="num">Calificados</th></tr></thead><tbody></tbody></table>

      <div class="section-title">Resultados por cartel</div>
      <table id="tbl-carteles"><thead><tr><th>Cartel</th><th class="num">Prom.</th><th class="num">Calificaciones</th></tr></thead><tbody></tbody></table>

      <button class="export-btn" id="btn-export">Exportar resultados (CSV)</button>
    </main>
  </div>

</div>

<script>
const SUPABASE_URL = "https://lwxrvbabjeethufloeuw.supabase.co";
const SUPABASE_KEY = "sb_publishable_6psr9G4XbAFrMCStCVMzYQ_-a-KK41i";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let session = null; // {type:'admin'|'juez', id, nombre}
let carteles = [];
let misCalificaciones = {}; // cartel_id -> row

const $ = (id) => document.getElementById(id);

function showView(name){
  $('view-login').classList.toggle('hidden', name!=='login');
  $('view-judge').classList.toggle('hidden', name!=='judge');
  $('view-admin').classList.toggle('hidden', name!=='admin');
}

// ---------- LOGIN ----------
$('btn-login').addEventListener('click', doLogin);
$('in-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const nombre = $('in-nombre').value.trim();
  const pass = $('in-pass').value;
  $('login-error').textContent = '';
  if(!nombre || !pass){ $('login-error').textContent = 'Escribe tu nombre y contraseña.'; return; }

  const { data: admins } = await sb.from('admins').select('*').eq('nombre', nombre).eq('password', pass);
  if(admins && admins.length){
    session = { type:'admin', id: admins[0].id, nombre: admins[0].nombre };
    startAdmin();
    return;
  }
  const { data: jueces } = await sb.from('jueces').select('*').eq('nombre', nombre).eq('password', pass);
  if(jueces && jueces.length){
    session = { type:'juez', id: jueces[0].id, nombre: jueces[0].nombre };
    startJudge();
    return;
  }
  $('login-error').textContent = 'Nombre o contraseña incorrectos.';
}

$('btn-logout-j').addEventListener('click', logout);
$('btn-logout-a').addEventListener('click', logout);
function logout(){ session = null; $('in-pass').value=''; showView('login'); }

// ---------- JUDGE ----------
async function startJudge(){
  $('judge-name').textContent = session.nombre;
  showView('judge');
  const { data: cData } = await sb.from('carteles').select('*').order('numero');
  carteles = cData || [];
  const { data: califs } = await sb.from('calificaciones').select('*').eq('juez_id', session.id);
  misCalificaciones = {};
  (califs||[]).forEach(c => misCalificaciones[c.cartel_id] = c);
  renderPosters();
}

function renderPosters(){
  const list = $('poster-list');
  list.innerHTML = '';
  let done = 0;
  carteles.forEach(p => {
    const existing = misCalificaciones[p.id];
    if(existing) done++;
    const card = document.createElement('div');
    card.className = 'poster' + (existing ? ' done' : '');
    card.innerHTML = `
      <div class="poster-head">
        <div>
          <div class="num">CARTEL ${p.numero}</div>
          <h3>${escapeHtml(p.titulo || ('Cartel ' + p.numero))}</h3>
        </div>
        <div class="status ${existing?'done':''} sans">${existing ? 'Calificado ✓' : 'Pendiente'}</div>
      </div>
      <div class="poster-body" id="body-${p.id}">
        ${scoreRowFor(p.id, 'contenido', 'Contenido', existing?.puntaje_contenido ?? 7)}
        ${scoreRowFor(p.id, 'diseno', 'Diseño', existing?.puntaje_diseno ?? 7)}
        ${scoreRowFor(p.id, 'presentacion', 'Presentación', existing?.puntaje_presentacion ?? 7)}
        <div class="field" style="margin-top:6px;">
          <label>Comentarios (opcional)</label>
          <textarea id="com-${p.id}">${existing?.comentarios ? escapeHtml(existing.comentarios) : ''}</textarea>
        </div>
        <div class="poster-actions">
          <button class="save-btn" data-id="${p.id}">Guardar calificación</button>
          <span class="save-msg" id="msg-${p.id}"></span>
        </div>
      </div>
    `;
    list.appendChild(card);
    card.querySelector('.poster-head').addEventListener('click', () => {
      card.querySelector('.poster-body').classList.toggle('open');
    });
  });
  list.querySelectorAll('.save-btn').forEach(btn => {
    btn.addEventListener('click', () => saveScore(btn.dataset.id));
  });
  updateSliderLabels();
  $('progress-text').textContent = `${done} / ${carteles.length}`;
  $('progress-fill').style.width = carteles.length ? (done/carteles.length*100)+'%' : '0%';
}

function scoreRowFor(posterId, key, label, val){
  return `
    <div class="score-row">
      <div class="score-label"><span>${label}</span><span class="val" id="val-${key}-${posterId}">${val}</span></div>
      <input type="range" min="1" max="10" step="1" value="${val}" id="sc-${key}-${posterId}"
        oninput="document.getElementById('val-${key}-${posterId}').textContent=this.value">
    </div>`;
}

function updateSliderLabels(){ /* handled inline via oninput */ }

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function saveScore(posterId){
  const contenido = parseInt(document.getElementById(`sc-contenido-${posterId}`).value);
  const diseno = parseInt(document.getElementById(`sc-diseno-${posterId}`).value);
  const presentacion = parseInt(document.getElementById(`sc-presentacion-${posterId}`).value);
  const comentarios = document.getElementById(`com-${posterId}`).value;

  const { data, error } = await sb.from('calificaciones').upsert({
    juez_id: session.id,
    cartel_id: parseInt(posterId),
    puntaje_contenido: contenido,
    puntaje_diseno: diseno,
    puntaje_presentacion: presentacion,
    comentarios: comentarios
  }, { onConflict: 'juez_id,cartel_id' }).select();

  const msg = document.getElementById(`msg-${posterId}`);
  if(error){
    msg.style.color = 'var(--bad)';
    msg.textContent = 'No se pudo guardar.';
    return;
  }
  msg.style.color = 'var(--good)';
  msg.textContent = 'Guardado ✓';
  if(data && data[0]) misCalificaciones[posterId] = data[0];
  renderPosters();
  setTimeout(()=>{ const m = document.getElementById(`msg-${posterId}`); if(m) m.textContent=''; }, 2500);
}

// ---------- ADMIN ----------
async function startAdmin(){
  showView('admin');
  const { data: jueces } = await sb.from('jueces').select('*').order('nombre');
  const { data: cList } = await sb.from('carteles').select('*').order('numero');
  const { data: califs } = await sb.from('calificaciones').select('*');

  const total = (cList||[]).length;
  const tbodyJ = document.querySelector('#tbl-jueces tbody');
  tbodyJ.innerHTML = '';
  (jueces||[]).forEach(j => {
    const count = (califs||[]).filter(c => c.juez_id === j.id).length;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escapeHtml(j.nombre)}</td>
      <td class="num"><span class="pill ${count===total && total>0 ? 'complete':'pending'}">${count} / ${total}</span></td>`;
    tbodyJ.appendChild(tr);
  });

  const tbodyC = document.querySelector('#tbl-carteles tbody');
  tbodyC.innerHTML = '';
  (cList||[]).forEach(p => {
    const rows = (califs||[]).filter(c => c.cartel_id === p.id);
    let avg = '—';
    if(rows.length){
      const sum = rows.reduce((acc,r) => acc + (r.puntaje_contenido||0) + (r.puntaje_diseno||0) + (r.puntaje_presentacion||0), 0);
      avg = (sum / (rows.length*3)).toFixed(1);
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escapeHtml(p.titulo || ('Cartel '+p.numero))}</td>
      <td class="num">${avg}</td>
      <td class="num">${rows.length}</td>`;
    tbodyC.appendChild(tr);
  });

  $('btn-export').onclick = () => exportCsv(cList, jueces, califs);
}

function exportCsv(cList, jueces, califs){
  const juezMap = {}; (jueces||[]).forEach(j => juezMap[j.id]=j.nombre);
  const cartelMap = {}; (cList||[]).forEach(c => cartelMap[c.id]=c.titulo || ('Cartel '+c.numero));
  let rows = [['Cartel','Juez','Contenido','Diseño','Presentación','Comentarios']];
  (califs||[]).forEach(r => {
    rows.push([
      cartelMap[r.cartel_id]||r.cartel_id,
      juezMap[r.juez_id]||r.juez_id,
      r.puntaje_contenido, r.puntaje_diseno, r.puntaje_presentacion,
      (r.comentarios||'').replace(/\n/g,' ').replace(/"/g,"'")
    ]);
  });
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'resultados_amei.csv';
  a.click();
}
</script>
</body>
</html>
